<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Car / Package Policy Calculator</title>
    <!-- Flatpickr CSS & Theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css"> <!-- Matches your dark calculator theme -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="company-badge">🚗 PRIVATE CAR / PACKAGE</div>

    <h1 class="main-title">Premium <span>Calculator</span></h1>

    <!-- ROW 1 -->
<div class="form-row-3col">

    <div class="input-group">
        <label>Zone</label>
        <select id="zone">
            <option value="A">Zone A (Metro)</option>
            <option value="B">Zone B (Others)</option>
        </select>
    </div>
    
    <div class="input-group">
        <label>Invoice Date</label>
        <input
            type="text"
            id="invoiceDate"
            placeholder="DD/MM/YYYY">
    </div>

        <div class="input-group">
        <label>Renewal Date</label>
        <input
            type="text"
            id="renewalDate"
            placeholder="DD/MM/YYYY">
    </div>

</div>

<!-- ROW 2 -->
<div class="form-row-3col">

    <div class="input-group">
        <label>Cubic Capacity</label>
        <select id="cc">
            <option value="1000">Up to 1000 CC</option>
            <option value="1500">1000 - 1500 CC</option>
            <option value="1501">Above 1500 CC</option>
        </select>
    </div>

    <div class="input-group">
        <label>Vehicle IDV (₹)</label>
        <input
            type="number"
            id="idv"
            placeholder="Vehicle Value">
    </div>

    <div class="input-group">
        <label>OD Discount (%)</label>
        <input
            type="number"
            id="odDisc"
            step="0.01"
            max="99.99"
            placeholder="0.00">
    </div>

</div>

<!-- ROW 3 -->
<div class="form-row-3col">

    <div class="input-group">
        <label>NCB (%)</label>
        <select id="ncb">
            <option value="0">0%</option>
            <option value="20">20%</option>
            <option value="25">25%</option>
            <option value="35">35%</option>
            <option value="45">45%</option>
            <option value="50">50%</option>
            <option value="65">65%</option>
        </select>
    </div>

    <div class="grid-cell">
        <label>&nbsp;</label>
        <div class="toggle-item neon-toggle">
            <label>
                Is it a Private Three-wheeled vehicle?
            </label>

            <label class="switch">
                <input
                    type="checkbox"
                    id="chkThreeWheeler">

                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="grid-cell">
        <label>&nbsp;</label>
        <div class="toggle-item neon-toggle">
            <label>
                Is UIIC Renewal?
            </label>

            <label class="switch">
                <input
                    type="checkbox"
                    id="chkUiicRenewal">

                <span class="slider"></span>
            </label>
        </div>
    </div>

</div>

        <div class="section-title">Add-on Covers</div>
<div class="toggle-grid-2col">

    <!-- 3. Additional IDV -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Additional IDV</label>
            <label class="switch">
                <input type="checkbox" id="toggleAddIdv">
                <span class="slider"></span>
            </label>
        </div>

        <div id="accessoriesFields" class="nested-fields" style="display: none;">

            <div class="form-row">
                <div class="input-group">
                    <label>Non-Electrical Accessories</label>
                    <input type="number" id="nonElecIdv" placeholder="0">
                </div>

                <div class="input-group">
                    <label>Electrical Accessories</label>
                    <input type="number" id="elecIdv" placeholder="0">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Electrical Accessories Discount (%)</label>
                    <input 
                        type="number"
                        id="elecDisc"
                        placeholder="0.00"
                        min="0"
                        max="99.99"
                        step="0.01"
                    >
                </div>
            </div>

        </div>
    </div>
     
    <!-- 4. Built-in CNG/LPG -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Built-in CNG/LPG</label>
            <label class="switch">
                <input type="checkbox" id="cngLpg">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 5. Geo Area Extension -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Geo Area Ext.</label>
            <label class="switch">
                <input type="checkbox" id="geoExt">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 6. Nil Depreciation -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Nil Dep (Zero Dep)</label>
            <label class="switch">
                <input type="checkbox" id="nilDep">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 7. Return to Invoice -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Return to Invoice</label>
            <label class="switch">
                <input type="checkbox" id="returnToInvoice">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 8. Consumables Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Consumables Cover</label>
            <label class="switch">
                <input type="checkbox" id="consumables">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 9. Engine & Gearbox Protection Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Engine & Gearbox Protection Cover</label>
            <label class="switch">
                <input type="checkbox" id="toggleEngine">
                <span class="slider"></span>
            </label>
        </div>
        <div id="engineFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Coverage Type</label>
                    <select id="engineType">
                        <option value="" selected disabled hidden>-- Select Coverage Option --</option>
                        <option value="platinum">Platinum Cover</option>
                        <option value="standard">Standard Cover</option>                     
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 10. Loss of Key Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Loss of Key Cover</label>
            <label class="switch">
                <input type="checkbox" id="toggleLossOfKey">
                <span class="slider"></span>
            </label>
        </div>
        <div id="lossOfKeyFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Sum Insured (₹)</label>
                    <select id="lossOfKeySI">
                        <option value="" selected disabled hidden>-- Select Sum Insured --</option>
                        <option value="10000">Rs. 10,000</option>
                        <option value="25000">Rs. 25,000</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 11. Tyre and Rim Protect Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Tyre & Rim Protect Cover</label>
            <label class="switch">
                <input type="checkbox" id="toggleTyreRim">
                <span class="slider"></span>
            </label>
        </div>
        <div id="tyreRimFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Tyre & Rim Sum Insured (₹)</label>
                    <select id="tyreRimSI">
                        <option value="" selected disabled hidden>-- Select Sum Insured --</option>
                        <option value="25000">Rs. 25,000</option>
                        <option value="50000">Rs. 50,000</option>
                        <option value="100000">Rs. 1,00,000</option>
                        <option value="200000">Rs. 2,00,000</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 13. EMI Protect Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>EMI Protect Cover</label>
            <label class="switch">
                <input type="checkbox" id="toggleEmi">
                <span class="slider"></span>
            </label>
        </div>
        <div id="emiFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Monthly EMI Amount (₹)</label>
                    <input type="number" id="emiAmount" placeholder="Enter monthly EMI">
                </div>
            </div>
        </div>
    </div>

    <!-- 14. Pet Care Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Pet Care Cover</label>
            <label class="switch">
                <input type="checkbox" id="togglePetCare">
                <span class="slider"></span>
            </label>
        </div>
        <div id="petCareFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Sum Insured (₹)</label>
                    <select id="petCareSI">
                        <option value="" selected disabled hidden>-- Select Sum Insured --</option>
                        <option value="10000">Rs. 10,000</option>
                        <option value="25000">Rs. 25,000</option>
                        <option value="50000">Rs. 50,000</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

        <!-- 16. Courtesy Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Courtesy Cover (Substitute Vehicle)</label>
            <label class="switch">
                <input type="checkbox" id="toggleCourtesy">
                <span class="slider"></span>
            </label>
        </div>
        <div id="courtesyFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Number of Days</label>
                    <select id="courtesyDays">
                        <option value="" selected disabled hidden>-- Select Number of Days --</option>
                        <option value="3">3 Days</option>
                        <option value="5">5 Days</option>
                        <option value="7">7 Days</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

        <!-- 12. NCB Protect Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>NCB Protect Cover</label>
            <label class="switch">
                <input type="checkbox" id="ncbProtect">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 15. Road Side Assistance -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Roadside Assistance (RSA)</label>
            <label class="switch">
                <input type="checkbox" id="rsa">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 17. Medical Expenses Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Medical Expenses Cover</label>
            <label class="switch">
                <input type="checkbox" id="toggleMedical">
                <span class="slider"></span>
            </label>
        </div>
        <div id="medicalFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Sum Insured (₹)</label>
                    <select id="medicalSI">
                        <option value="" selected disabled hidden>-- Select Sum Insured --</option>
                        <option value="50000">Rs. 50,000</option>
                        <option value="100000">Rs. 1,00,000</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 18. Personal Belongings Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Personal Belongings Cover</label>
            <label class="switch">
                <input type="checkbox" id="togglePersonalBelongings">
                <span class="slider"></span>
            </label>
        </div>
        <div id="PersonalBelongingsFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Sum Insured (₹)</label>
                    <select id="PersonalBelongingsSI">
                        <option value="" selected disabled hidden>-- Select Sum Insured --</option>
                        <option value="25000">Rs. 25,000</option>
                        <option value="50000">Rs. 50,000</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 19. Additional Towing Charges Cover -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Additional Towing Charges Cover</label>
            <label class="switch">
                <input type="checkbox" id="toggleTowing">
                <span class="slider"></span>
            </label>
        </div>
        <div id="towingFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Towing Charges Limit (Max ₹1,500)</label>
                    <input type="number" id="towingAmount" placeholder="Enter amount up to 1500" min="0" max="1500">
                </div>
            </div>
        </div>
    </div>
    
    <!-- 20. Anti-Theft Discount -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Anti-Theft Disc.</label>
            <label class="switch">
                <input type="checkbox" id="antiTheft">
                <span class="slider"></span>
            </label>
        </div>
    </div>

</div>

        <!-- LIABILITY SECTION -->
<div class="section-title" style="margin-top: 25px;">Liability & PA Section</div>
<div class="toggle-grid-2col">

    <!-- 1. CPA Owner-Driver -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>CPA Owner-Driver Cover</label>
            <label class="switch">
                <input type="checkbox" id="toggleCpa">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 2. Paid Driver (Simple Toggle) -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Legal Liability to Paid Driver (LLPD)</label>
            <label class="switch">
                <input type="checkbox" id="togglePaidDriver">
                <span class="slider"></span>
            </label>
        </div>
    </div>

        <!-- 4. Platinum PA Cover -->
    <div class="grid-cell"> 
        <div class="toggle-item">
            <label>Platinum PA Cover</label>
            <label class="switch">
                <input type="checkbox" id="togglePlatinumPa">
                <span class="slider"></span>
            </label>
        </div>
        <div id="platinumPaFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Seating Capacity</label>
                    <input type="number" id="platSeating" placeholder="e.g. 5" min="1">
                </div>
                <div class="input-group">
                    <label>Sum Insured (₹)</label>
                    <select id="platSi">
                        <option value="" selected disabled hidden>-- Select SI --</option>
                        <option value="500000">Rs. 5,00,000</option>
                        <option value="1000000">Rs. 10,00,000</option>
                        <option value="1500000">Rs. 15,00,000</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. NFPP (Non-Fare Paying Passenger) -->
    <div class="grid-cell">
        <div class="toggle-item">
            <label>Legal Liability to NFPP</label>
            <label class="switch">
                <input type="checkbox" id="toggleNfpp">
                <span class="slider"></span>
            </label>
        </div>
        <div id="nfppFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Number of NFPP</label>
                    <input type="number" id="nfppCount" placeholder="Enter quantity" min="1">
                </div>
            </div>
        </div>
    </div>
 
        <!-- 5. Unnamed PA Cover -->
    <div class="grid-cell"> 
        <div class="toggle-item">
            <label>Unnamed PA Cover</label>
            <label class="switch">
                <input type="checkbox" id="toggleUnnamedPa">
                <span class="slider"></span>
            </label>
        </div>
        <div id="unnamedPaFields" class="nested-fields" style="display: none;">
            <div class="form-row">
                <div class="input-group">
                    <label>Number of Persons</label>
                    <input type="number" id="unnamedPersons" placeholder="e.g. 4" min="1">
                </div>
                <div class="input-group">
                    <label>Sum Insured (Multiples of 10000 up to 2L)</label>
                    <input type="number" id="unnamedSi" placeholder="e.g. 50000" min="10000" max="200000" step="10000">
                    <small id="unnamedSiError" style="color: #ff4a4a; display: none; font-size: 11px; margin-top: 4px;">Must be a multiple of 10,000 (Max 2,00,000)</small>
                </div>
            </div>
        </div>
    </div>
</div>

        <button class="calc-btn" onclick="calculatePrivateCarPolicy()">CALCULATE PREMIUM</button>
    </div>

    <a href="privatecar-menu.html" class="back-link" style="display:block; text-align:center; margin-top:30px; color:#00f0d0; text-decoration:none;">← Back to Policy Types</a>


<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>

<script src="privatecar-package.js"></script>

    <!-- ================================================= -->
    <!-- WARNING MODAL -->
    <!-- ================================================= -->
    
    <div id="warningModal" class="warning-modal">
    
        <div class="warning-box">
    
            <div class="warning-header">
                ⚠ Premium Calculation Warnings
            </div>
    
            <div id="warningList" class="warning-list">
            </div>
    
            <button
                class="warning-btn"
                onclick="closeWarningModal()">
    
                OK
    
            </button>
    
        </div>
    
    </div>
    
</body>
</html>
